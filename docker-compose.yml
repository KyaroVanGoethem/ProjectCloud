services:
  web-app:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    environment:
      - PORT=3000

  reverse-proxy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-app

volumes:
  caddy_data:
  caddy_config:
